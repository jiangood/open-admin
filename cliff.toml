# git-cliff 配置文件
# 参考: https://git-cliff.org/docs/configuration

[changelog]
header = "# 变更日志 (Changelog)\n\n该项目所有显著的变更都将记录在此文件中。\n\n格式基于 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，\n并遵循 [Semantic Versioning](https://semver.org/spec/v2.0.0.html)。\n"
body = """
{% if version %}\
  ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
  ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group | upper_first }}
  {% for commit in commits | filter(attribute="scope") %}
    - {{ commit.message | upper_first }}\
    {% if commit.scope %}（{{ commit.scope }}）{% endif %}\
  {%- endfor %}
{%- for commit in commits | filter(attribute="scope") %}
{%- else %}
  {% for commit in commits %}
    - {{ commit.message | upper_first }}
  {% endfor %}
{%- endfor %}
{% endfor %}
"""
trim = true
postprocessors = [{ pattern = "\\[\\s*skip\\s*ci\\s*\\]", replace = "" }]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = "\\(.*\\)\\s*!", replace = "" },
  { pattern = "\\[skip\\s*ci\\s*\\]", replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "新功能" },
  { message = "^fix", group = "Bug 修复" },
  { message = "^docs", group = "文档" },
  { message = "^style", group = "代码风格" },
  { message = "^refactor", group = "重构" },
  { message = "^perf", group = "性能优化" },
  { message = "^test", group = "测试" },
  { message = "^chore", group = "杂项" },
  { message = "^ci", group = "CI/CD" },
  { message = "^build", group = "构建" },
  { message = "^revert", group = "回退" },
]
filter_commits = false
topo_order = false
sort_commits = "newest"