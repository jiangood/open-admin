# ===================================================================
# open-admin Docker Compose
# ===================================================================
# 启动方式：
#   docker compose up -d
#
# 首次启动会自动创建 MySQL 数据库（见 mysql 服务配置），
# 应用启动时 JPA 会自动建表。
# ===================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: open-admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: openadmin
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      # 格式: "宿主机端口:容器端口"
      # 左边 3306 是 Windows/Mac 上可以访问的端口
      # 右边 3306 是 MySQL 容器内部的端口（不要改）
      # 如果宿主机 3306 已被占用，可以改成其他端口，如 "3307:3306"
      - "3306:3306"
    volumes:
      # 将 MySQL 数据持久化到宿主机 ./mysql-data 目录
      # 格式: "宿主机目录:容器内目录"
      # ./mysql-data 是 docker-compose.yml 所在目录下的 mysql-data 文件夹
      # /var/lib/mysql 是 MySQL 容器内存储数据的目录
      # 如果不配置这个，删除容器后数据库数据会全部丢失！
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: open-admin-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 这些环境变量对应 application.yml 中的 ${db_ip} 等占位符
      # mysql 是 docker-compose 内部的主机名，指向上面的 mysql 服务
      db_ip: mysql
      db_port: 3306
      db_database: openadmin
      db_username: root
      db_password: 123456
    ports:
      # 格式: "宿主机端口:容器端口"
      # 左边 8080 是浏览器中访问的端口（如 http://localhost:8080）
      # 右边 8080 是 Spring Boot 容器内的端口（由 server.port 配置）
      # 如果宿主机 8080 已被占用，可以改成其他端口，如 "8081:8080"
      - "8080:8080"
    volumes:
      # 将应用数据持久化到宿主机 ./app-data 目录
      # 应用运行时会在 data/ 目录下生成 RSA 密钥等文件（见 RsaTool.java）
      # 如果不配置这个，每次重启容器都会重新生成 RSA 密钥，
      # 导致之前加密的密码无法解密！
      - ./app-data:/app/data

# ===================================================================
# 持久化目录说明
# ===================================================================
# 启动后会在 docker-compose.yml 所在目录下创建两个文件夹：
#
#   mysql-data/    MySQL 数据库文件（表结构、数据等）
#   app-data/      应用运行时数据（RSA 密钥、上传文件等）
#
# 这两个目录可以安全备份和迁移。
# 如果想重置数据，删除对应文件夹即可（⚠️ 谨慎操作！）。
# ===================================================================