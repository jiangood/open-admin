## 框架预设字典定义。业务项目可在 dict-lib-{profile}.yml 中扩展或覆盖。
dicts:
  - label: 机构类型
    code: orgType
    items:
      - {label: 单位, code: 10, color: success}
      - {label: 部门, code: 20}
  - label: 审核状态
    code: approveStatus
    items:
      - {label: 待提交, code: DRAFT, color: default}
      - {label: 审核中, code: PENDING, color: warning}
      - {label: 审核通过, code: APPROVED, color: success}
      - {label: 审核未通过, code: REJECTED, color: error}
  - label: 性别
    code: sex
    items:
      - {label: 男, code: MALE}
      - {label: 女, code: FEMALE}
      - {label: 保密, code: UNKNOWN}
  - label: 是否
    code: yesNo
    items:
      - {label: 是, code: Y, color: success}
      - {label: 否, code: N, color: error}
  - label: 数据权限
    code: dataPermType
    items:
      - {label: 所有, code: ALL}
      - {label: 本级, code: LEVEL}
      - {label: 本级和子级, code: CHILDREN}
      - {label: 自定义, code: CUSTOM}
  - label: 状态颜色
    code: statusColor
    items:
      - {label: 成功, code: SUCCESS}
      - {label: 处理中, code: PROCESSING}
      - {label: 错误, code: ERROR}
      - {label: 警告, code: WARNING}
      - {label: 默认, code: DEFAULT}
      - {label: 红色, code: RED}
      - {label: 蓝色, code: BLUE}
      - {label: 绿色, code: GREEN}
      - {label: 灰色, code: GRAY}
