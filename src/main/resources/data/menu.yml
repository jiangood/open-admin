## 框架预设菜单结构。业务项目可在同目录下加 menu-*.yml 扩展或覆盖。
menus:
  - id: sys
    name: 系统管理
    seq: 10000
    icon: SettingOutlined
    children:
      - id: sys-user
        name: 用户管理
        path: /system/user
        icon: UserOutlined
        perms:
          - {name: 读取, code: read}
          - {name: 创建, code: create}
          - {name: 删除, code: delete}
          - {name: 重置密码, code: reset-password}
          - {name: 分配权限, code: grant-permission}
      - id: sys-org
        name: 机构管理
        path: /system/org
        icon: ApartmentOutlined
        perms:
          - {name: 读取, code: read}
          - {name: 创建, code: create}
          - {name: 更新, code: update}
          - {name: 删除, code: delete}
      - id: sys-role
        name: 角色管理
        path: /system/role
        icon: IdcardOutlined
        perms:
          - {name: 读取, code: read}
          - {name: 创建, code: create}
          - {name: 更新, code: update}
          - {name: 删除, code: delete}
          - {name: 分配权限, code: grant-permission}
      - id: sys-manual
        name: 操作手册
        path: /system/manual
        icon: CopyOutlined
        perms:
          - {name: 读取, code: read}
          - {name: 创建, code: create}
          - {name: 删除, code: delete}
      - id: sys-dict
        name: 数据字典
        path: /system/dict
        icon: FileSearchOutlined
        perms:
          - {name: 读取, code: read}
          - {name: 创建, code: create}
          - {name: 删除, code: delete}
      - id: job
        name: 定时作业
        path: /system/job
        icon: OrderedListOutlined
        perms:
          - {name: 读取, code: read}
          - {name: 创建, code: create}
          - {name: 删除, code: delete}
          - {name: 执行一次, code: trigger}
          - {name: 清理日志, code: clean-log}
      - id: sys-file
        name: 文件管理
        path: /system/file
        icon: FolderOpenOutlined
        perms:
          - {name: 读取, code: read}
          - {name: 删除, code: delete}
      - id: sys-log
        name: 操作日志
        path: /system/log
        icon: FileSearchOutlined
        perms:
          - {name: 读取, code: read}
