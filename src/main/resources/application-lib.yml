# ===================================================================
# open-admin 框架默认配置
# 业务项目在 application.yml 中显式引入即可继承：
#
#   # 第一个文档：只放 import，不要在这里写业务配置
#   spring:
#     config:
#       import: classpath:application-lib.yml
#
#   # 分隔符之后：业务项目自己的配置，优先级高于本文件
#   ---
#   server:
#     port: 8080
#
# 注意：spring.config.import 导入的内容会被当作「插在声明它的那个文档之后」
# 的额外文档，优先级更高。所以与 import 写在同一个文档里的配置会被本文件覆盖，
# 业务配置必须写在 --- 之后的新文档里才能真正覆盖本文件的默认值。
# ===================================================================
sys:
  # 数据根目录（约定不带结尾斜杠）：会话落盘、日志、上传文件都在其下派生。
  data-dir: /data
  file:
    upload-path: "${sys.data-dir}/upload"

server:
  servlet:
    session:
      # 会话空闲超时（分钟）：引用 sys.session-idle-time，保持与文档一致。
      # 此前未接线，实际使用 Spring Boot 默认的 30m。
      timeout: "${sys.session-idle-time:180}m"
      # 优雅停机时把 session 写入 store-dir，启动时恢复，实现重启免登录。
      # 仅对单实例、正常停机有效；kill -9 / 崩溃 / 多实例请改用 Spring Session。
      # 目录由 sys.data-dir 派生（无尾斜杠，避免拼出 /datasession 这类路径）；
      # 换挂载点只改 sys.data-dir，未挂载 /data 时可设 persistent: false 关闭落盘。
      persistent: true
      store-dir: "${sys.data-dir}/session"

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
  servlet:
    multipart:
      # 图片前端已压缩，此处留足空间给大文件/富文本直传
      max-file-size: 20MB
      max-request-size: 100MB
  cache:
    type: caffeine
    caffeine:
      spec: initialCapacity=50,maximumSize=10000,expireAfterWrite=5m
  jpa:
    generate-ddl: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    web:
      pageable:
        one-indexed-parameters: true
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    locale: zh_CN
  datasource:
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:file:${sys.data-dir}/db_h2/database;MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password:

logging:
  file:
    path: "${sys.data-dir}/logs"
  level:
    io.github.jiangood: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [trace-id=%X{traceId}] %5p --- [%t] %logger{40} : %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [trace-id=%X{traceId}] %5p --- [%t] %logger{40} : %m%n"

