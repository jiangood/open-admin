# 可选：切换到 MySQL 数据库（框架独立运行 / 示例应用）。
# 用法：mvn -Pdev spring-boot:run -Dspring-boot.run.profiles=mysql
# 或容器部署：SPRING_PROFILES_ACTIVE=prod,mysql（后面的 profile 优先生效）
# 需要换连接目标时，用环境变量覆盖标准键即可：
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/open-admin?allowPublicKeyRetrieval=true&autoReconnect=true&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=CONVERT_TO_NULL&useSSL=false&nullCatalogMeansCurrent=true
    username: root
    password: 123456
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
