spring:
  cache:
    type: caffeine
    caffeine:
      spec: initialCapacity=50,maximumSize=10000,expireAfterWrite=5m
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    generate-ddl: true
    show-sql: false
  data:
    web:
      pageable:
        one-indexed-parameters: true
  jackson:
    time-zone: GMT+8