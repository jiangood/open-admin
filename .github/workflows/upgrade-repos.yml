name: Auto Upgrade Framework Consumers

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      target_version:
        description: '目标框架版本号（留空则自动取最新发布版本，如 3.0.10）'
        required: false
        type: string
      model:
        description: 'opencode 模型（默认免费模型，无需 API Key）'
        required: false
        type: string
        default: 'opencode/deepseek-v4-flash-free'
      tag_prefix:
        description: '升级后打 tag 的前缀（默认 v，如 v3.0.10）'
        required: false
        type: string
        default: 'v'

concurrency:
  group: auto-upgrade-framework-consumers
  cancel-in-progress: false

jobs:
  upgrade:
    name: upgrade-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: example
            repo: open-admin-example
            branch: master
            frontend_build: 'npm run build'
          - name: docker-admin
            repo: docker-admin
            branch: main
            frontend_build: 'npm run build'
          - name: flowable
            repo: open-admin-flowable
            branch: master
            frontend_build: 'npm run build'
    steps:
      - name: 获取最新框架版本（npm 验证真实发布）
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CANDIDATE="${{ inputs.target_version }}"
          if [ -z "$CANDIDATE" ]; then
            CANDIDATE=$(gh release list --repo jiangood/open-admin -L 1 --json tagName --jq '.[0].tagName' | sed 's/^v//')
            echo "GitHub 最新 release tag: v$CANDIDATE"
          fi
          # 用 npm 验证版本是否真实发布（GitHub tag 可能存在但 npm publish 失败/跳过）
          if npm view "@jiangood/open-admin@$CANDIDATE" version &>/dev/null; then
            echo "npm 已验证 @jiangood/open-admin@$CANDIDATE 已发布"
          else
            CANDIDATE=$(npm view @jiangood/open-admin version)
            echo "::warning::npm 上未发布该版本，改用 npm 最新已发布版本 v$CANDIDATE"
          fi
          echo "version=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "目标版本: v$CANDIDATE"

      - name: 检出 open-admin 源码（目标版本，用于同步 skills/docs）
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: v${{ steps.version.outputs.version }}

      - name: 检出 ${{ matrix.repo }}
        env:
          EXAMPLE_PAT: ${{ secrets.EXAMPLE_PAT }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          if [ -z "$EXAMPLE_PAT" ]; then
            echo "::error::未配置 EXAMPLE_PAT 密钥（需对 jiangood/${{ matrix.repo }} 有 repo 写权限的 PAT）"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${EXAMPLE_PAT}@github.com/jiangood/${{ matrix.repo }}.git" repo
          cd repo
          git config user.name "open-admin-bot"
          git config user.email "open-admin-bot@users.noreply.github.com"

      - name: 对比版本（无新版本则直接结束）
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          POM_VER=$(grep -A3 '<artifactId>open-admin</artifactId>' repo/pom.xml | grep -oP '<version>\K[^<]+' | head -1)
          NPM_VER=$(jq -r '(.dependencies // {})["@jiangood/open-admin"] // (.peerDependencies // {})["@jiangood/open-admin"] // empty' repo/web/package.json 2>/dev/null | sed 's/[\^~]//')
          echo "当前版本: pom=$POM_VER npm=$NPM_VER, 目标: $VERSION"
          if [ -z "$POM_VER" ]; then
            echo "::error::未能从 ${{ matrix.repo }} pom.xml 解析 open-admin 版本"
            exit 1
          fi
          if [ "$POM_VER" = "$VERSION" ] && { [ -z "$NPM_VER" ] || [ "$NPM_VER" = "$VERSION" ]; }; then
            echo "${{ matrix.repo }} 已是最新版本 $VERSION，无需升级"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步框架 skills/docs 到仓库（供 opencode 发现 oa-upgrade skill）
        if: steps.check.outputs.skip != 'true'
        run: |
          set -e
          cd repo
          rm -rf docs/open-admin
          mkdir -p docs/open-admin
          cp -r "$GITHUB_WORKSPACE"/docs/open-admin/. docs/open-admin/
          mkdir -p .opencode/skills/oa-crud .opencode/skills/oa-upgrade .opencode/skills/oa-upgrade-docs
          cp "$GITHUB_WORKSPACE/.opencode/skills/oa-crud/SKILL.md" .opencode/skills/oa-crud/SKILL.md
          cp "$GITHUB_WORKSPACE/.opencode/skills/oa-upgrade/SKILL.md" .opencode/skills/oa-upgrade/SKILL.md
          cp "$GITHUB_WORKSPACE/.opencode/skills/oa-upgrade-docs/SKILL.md" .opencode/skills/oa-upgrade-docs/SKILL.md
          if [ ! -f AGENTS.md ]; then
            cp docs/open-admin/AGENTS.md AGENTS.md
          fi

      - name: 设置 JDK 21
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 opencode
        if: steps.check.outputs.skip != 'true'
        run: npm i -g opencode-ai

      - name: opencode 执行升级（oa-upgrade skill）
        if: steps.check.outputs.skip != 'true'
        working-directory: repo
        env:
          OPENCODE_MODEL: ${{ inputs.model || 'opencode/deepseek-v4-flash-free' }}
        run: |
          opencode run -m "$OPENCODE_MODEL" --auto \
            "请使用项目内置的 oa-upgrade skill，将 open-admin 框架从当前版本升级到 v${{ steps.version.outputs.version }}。要求：
             1) 按 skill 流程直接执行，不要询问确认，直接升级 pom.xml 中 io.github.jiangood:open-admin 与 web/package.json 中 @jiangood/open-admin 的版本；
             2) 用 webfetch 读取 https://github.com/jiangood/open-admin/releases/tag/v${{ steps.version.outputs.version }} 的 Release Notes 与对应提交日志，处理 Breaking Changes 与代码迁移；
             3) 运行 mvn clean compile 验证后端；前端如存在 build 脚本则运行 npm run build，没有则跳过；
             4) 不要执行 git commit / git push。"

      - name: 递增消费仓库自身版本（写回 pom + package.json）
        if: steps.check.outputs.skip != 'true'
        working-directory: repo
        id: versionbump
        run: |
          set -e
          git fetch origin --tags --force
          PREFIX="${{ inputs.tag_prefix || 'v' }}"
          LATEST=$(git tag | grep -E "^${PREFIX}[0-9]+\.[0-9]+\.[0-9]+$" \
            | sed "s/^${PREFIX}//" | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "仓库无自身版本 tag，跳过递增与打 tag"
            echo "skip_tag=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "递增版本: $LATEST -> $NEXT"
          echo "new_version=$NEXT" >> "$GITHUB_OUTPUT"
          mvn versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false -q
          [ -f web/package.json ] && (cd web && npm version "$NEXT" --no-git-tag-version --allow-same-version)

      - name: 后端编译验证（push 前硬性门槛）
        if: steps.check.outputs.skip != 'true'
        working-directory: repo
        run: mvn clean compile

      - name: 前端构建验证（push 前硬性门槛）
        if: steps.check.outputs.skip != 'true' && matrix.frontend_build != ''
        working-directory: repo/web
        run: |
          npm install
          ${{ matrix.frontend_build }}

      - name: 提交并推送
        if: steps.check.outputs.skip != 'true'
        working-directory: repo
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: upgrade open-admin to v$VERSION"
          git push origin ${{ matrix.branch }}

      - name: 打 tag 标记升级版本
        if: steps.check.outputs.skip != 'true' && steps.versionbump.outputs.skip_tag != 'true'
        working-directory: repo
        run: |
          TAG="${{ inputs.tag_prefix || 'v' }}${{ steps.versionbump.outputs.new_version }}"
          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG 已存在，跳过"
            exit 0
          fi
          if git log -1 --oneline | grep -q "upgrade open-admin"; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "已打 tag $TAG 并推送"
          else
            echo "本次无升级提交，跳过打 tag"
          fi
