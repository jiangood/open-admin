name: Publish NPM, Maven

on:
  push:
    tags:
      - 'v*'

jobs:
  maven-publish:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: open-admin
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract Tag
        id: tag
        uses: aaronbarnaby/get-tag@v1.0.0
        with:
          without_prefix_v: true

      - name: Validate pom.xml version
        run: |
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          POM_VERSION=$(awk '/<artifactId>open-admin<\/artifactId>/{found=1} found && /<version>[0-9]/{print; exit}' pom.xml | grep -oP '<version>\K[^<]+' | tr -d '\r')

          echo "Tag version: $TAG_VERSION"
          echo "POM version: $POM_VERSION"

          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pom.xml version ($POM_VERSION)"
            exit 1
          fi

          echo "✓ Maven version matches tag!"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_KEY }}

      - name: Maven Test (H2)
        run: mvn test -q

      - name: Maven Test (MySQL)
        run: mvn test -q -Dspring.profiles.active=mysql

      - name: Publish MAVEN
        run: mvn -q deploy -DskipTests -P publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_KEY }}

  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract Tag
        id: tag
        uses: aaronbarnaby/get-tag@v1.0.0
        with:
          without_prefix_v: true

      - name: Validate package.json version
        run: |
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          NPM_VERSION=$(jq -r '.version' web/package.json)

          echo "Tag version: $TAG_VERSION"
          echo "NPM version: $NPM_VERSION"

          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($NPM_VERSION)"
            exit 1
          fi

          echo "✓ NPM version matches tag!"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build NPM package
        run: |
          cd web
          npm install
          npm run build

      - name: Publish NPM package (if not exists)
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          if npm view "@jiangood/open-admin@$VERSION" version &>/dev/null; then
            echo "npm 上 @jiangood/open-admin@$VERSION 已存在，跳过发布"
          else
            cd web
            npm publish --access public --no-git-checks
          fi

  sync-mirror:
    needs: npm-publish
    runs-on: ubuntu-latest
    steps:
      - name: 同步阿里云镜像仓库
        run: |
          npm install -g cnpm --registry=https://registry.npmmirror.com
          cnpm sync @jiangood/open-admin

  create-release:
    needs: [maven-publish, npm-publish]
    if: always() && needs.maven-publish.result != 'failure' && needs.npm-publish.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Extract Tag
        id: tag
        uses: aaronbarnaby/get-tag@v1.0.0
        with:
          without_prefix_v: true
      - name: Build framework-files.zip
        run: |
          ZIP_DIR=$(mktemp -d)
          mkdir -p "$ZIP_DIR/docs" "$ZIP_DIR/.opencode"
          cp -r docs/open-admin "$ZIP_DIR/docs/open-admin"
          mkdir -p "$ZIP_DIR/.opencode/skills"
          cp -r .opencode/skills/oa-crud "$ZIP_DIR/.opencode/skills/"
          cp -r .opencode/skills/oa-upgrade "$ZIP_DIR/.opencode/skills/"
          cp -r .opencode/skills/oa-sync-docs "$ZIP_DIR/.opencode/skills/"
          cp -r .opencode/skills/oa-sonar-scan "$ZIP_DIR/.opencode/skills/"
          (cd "$ZIP_DIR" && zip -qr "$GITHUB_WORKSPACE/framework-files.zip" docs .opencode)
          echo "✓ framework-files.zip 构建完成"

      - name: Create Release & Upload Asset (if not exists)
        run: |
          if gh release view "${{ github.ref_name }}" &>/dev/null; then
            echo "Release ${{ github.ref_name }} 已存在"
          else
            gh release create "${{ github.ref_name }}" \
              --title "Release v${{ steps.tag.outputs.tag }}" \
              --latest \
              --generate-notes
          fi
          gh release upload "${{ github.ref_name }}" framework-files.zip \
            --clobber --repo jiangood/open-admin
          echo "✓ framework-files.zip 已上传"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
