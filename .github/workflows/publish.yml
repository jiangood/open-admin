name: Publish NPM, Maven

on:
  push:
    tags:
      - 'v*'
jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Extract Tag
        id: tag
        uses: aaronbarnaby/get-tag@v1.0.0
        with:
          without_prefix_v: true # Remove prefix `v` from tag

      - name: Validate versions
        run: |
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          POM_VERSION=$(grep -oP '<revision>\K[^<]+' pom.xml)
          NPM_VERSION=$(grep -oP '"version":\s*"\K[^"]+' web/package.json)
          
          echo "Tag version: $TAG_VERSION"
          echo "POM version: $POM_VERSION"
          echo "NPM version: $NPM_VERSION"
          
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pom.xml version ($POM_VERSION)"
            exit 1
          fi
          
          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($NPM_VERSION)"
            exit 1
          fi
          
          echo "✓ All versions match!"

      - name: Publish MAVEN
        run: mvn -q  deploy -DskipTests   -Drevision=${{ steps.tag.outputs.tag }}  -P publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_KEY }}
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org


      - name: Extract Tag
        id: tag
        uses: aaronbarnaby/get-tag@v1.0.0
        with:
          without_prefix_v: true # Remove prefix `v` from tag

      - name: 发布 npm 包
        run: |
          cd web
          npm install 
          npm run build
          npm publish -r --access public --no-git-checks

        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_ACCESS_TOKEN}}

  npm-sync:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org
      - name: 同步阿里云镜像仓库
        run: |
          npm install -g cnpm --registry=https://registry.npmmirror.com 
          cnpm sync @jiangood/open-admin




