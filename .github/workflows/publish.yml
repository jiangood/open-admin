name: Publish NPM, Maven

on:
  push:
    tags:
      - 'v*'

jobs:
  maven-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract Tag
        id: tag
        uses: aaronbarnaby/get-tag@v1.0.0
        with:
          without_prefix_v: true

      - name: Validate pom.xml version
        run: |
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          POM_VERSION=$(awk '/<artifactId>open-admin<\/artifactId>/{found=1} found && /<version>[0-9]/{print; exit}' pom.xml | grep -oP '<version>\K[^<]+' | tr -d '\r')

          echo "Tag version: $TAG_VERSION"
          echo "POM version: $POM_VERSION"

          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pom.xml version ($POM_VERSION)"
            exit 1
          fi

          echo "✓ Maven version matches tag!"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_KEY }}

      - name: Maven Test
        run: mvn test -q

      - name: Publish MAVEN
        run: mvn -q deploy -DskipTests -P publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_KEY }}

  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract Tag
        id: tag
        uses: aaronbarnaby/get-tag@v1.0.0
        with:
          without_prefix_v: true

      - name: Validate package.json version
        run: |
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          NPM_VERSION=$(jq -r '.version' web/package.json)

          echo "Tag version: $TAG_VERSION"
          echo "NPM version: $NPM_VERSION"

          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($NPM_VERSION)"
            exit 1
          fi

          echo "✓ NPM version matches tag!"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build NPM package
        run: |
          cd web
          npm ci
          npm run build

      - name: Publish NPM package (Trusted Publishing)
        run: |
          cd web
          npm publish --access public --no-git-checks

      - name: 同步阿里云镜像仓库
        run: |
          npm install -g cnpm --registry=https://registry.npmmirror.com
          cnpm sync @jiangood/open-admin

      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release v${{ steps.tag.outputs.tag }}" \
            --latest \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
