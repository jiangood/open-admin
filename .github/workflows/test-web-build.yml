name: Test Web Build

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
        

      - name: Install dependencies
        run: npm install
        working-directory: web

      - name: Build project
        run: npm run build
        working-directory: web
